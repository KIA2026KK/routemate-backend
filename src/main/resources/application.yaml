spring:
  application:
    name: routemate-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:routemate}?sslmode=${DB_SSL_MODE:prefer}
    username: ${DB_USER:routemate}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
server:
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful
routemate:
  livekit:
    server-url: ${LIVEKIT_SERVER_URL:}
    public-url: ${LIVEKIT_PUBLIC_URL:}
    api-key: ${LIVEKIT_API_KEY:}
    api-secret: ${LIVEKIT_API_SECRET:}
  vehicle:
    allow-mock: ${ALLOW_MOCK_VEHICLE:false}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
